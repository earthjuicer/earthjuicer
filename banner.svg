<svg width="860" height="200" viewBox="0 0 860 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bg { fill: #0d1117; }
      .scanline {
        fill: none;
        stroke: #00ff9d;
        stroke-width: 0.3;
        opacity: 0.07;
      }
      .border {
        fill: none;
        stroke: #00ff9d;
        stroke-width: 1.5;
        opacity: 0.6;
      }
      .corner {
        fill: #00ff9d;
        opacity: 0.8;
      }

      .title {
        font-family: 'Courier New', Courier, monospace;
        font-size: 38px;
        font-weight: bold;
        fill: #00ff9d;
      }

      .subtitle {
        font-family: 'Courier New', Courier, monospace;
        font-size: 13px;
        fill: #00ff9d;
        opacity: 0.7;
      }

      .tag-text {
        font-family: 'Courier New', Courier, monospace;
        font-size: 12px;
        fill: #00ff9d;
        opacity: 0.9;
      }

      .status-text {
        font-family: 'Courier New', Courier, monospace;
        font-size: 11px;
        fill: #00ff9d;
        opacity: 0.35;
      }

      /* Animations */
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }

      @keyframes flicker {
        0%, 94%, 100% { opacity: 1; }
        95% { opacity: 0.3; }
        97% { opacity: 0.85; }
      }

      @keyframes slideIn {
        from {
          opacity: 0;
          transform: translateX(-18px);
        }
        to {
          opacity: 1;
          transform: translateX(0);
        }
      }

      @keyframes fadeUp {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes float {
        0%, 100% {
          transform: translateY(0);
          opacity: 0.5;
        }
        50% {
          transform: translateY(-7px);
          opacity: 1;
        }
      }

      @keyframes pulse {
        0%, 100% {
          opacity: 0.25;
          transform: scale(1);
        }
        50% {
          opacity: 0.8;
          transform: scale(1.08);
        }
      }

      @keyframes codeFlow {
        0% {
          transform: translateX(0);
          opacity: 0.2;
        }
        50% {
          opacity: 0.8;
        }
        100% {
          transform: translateX(22px);
          opacity: 0.2;
        }
      }

      .cursor {
        fill: #00ff9d;
        animation: blink 1s step-end infinite;
      }

      .title-anim {
        animation:
          slideIn 0.7s ease-out both,
          flicker 7s 2s ease-in-out infinite;
      }

      .sub-anim {
        animation: fadeUp 0.7s 0.5s ease-out both;
      }

      .tag1-anim {
        animation: fadeUp 0.6s 0.8s ease-out both;
      }

      .tag2-anim {
        animation: fadeUp 0.6s 1s ease-out both;
      }

      .tag3-anim {
        animation: fadeUp 0.6s 1.2s ease-out both;
      }

      .p1 {
        animation: float 3.5s ease-in-out infinite;
      }

      .p2 {
        animation: float 4.2s 0.9s ease-in-out infinite;
      }

      .p3 {
        animation: float 3.9s 1.5s ease-in-out infinite;
      }

      .p4 {
        animation: float 5.1s 0.4s ease-in-out infinite;
      }

      .p5 {
        animation: float 4.6s 2.1s ease-in-out infinite;
      }

      .pulse {
        transform-box: fill-box;
        transform-origin: center;
        animation: pulse 2.4s ease-in-out infinite;
      }

      .codeflow {
        animation: codeFlow 2.8s ease-in-out infinite;
      }
    </style>

    <filter id="glow1">
      <feGaussianBlur
        stdDeviation="2.5"
        result="blur"
      />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect
    width="860"
    height="200"
    class="bg"
    rx="8"
  />

  <!-- Scanlines -->
  <g>
    <line x1="0" y1="20" x2="860" y2="20" class="scanline"/>
    <line x1="0" y1="40" x2="860" y2="40" class="scanline"/>
    <line x1="0" y1="60" x2="860" y2="60" class="scanline"/>
    <line x1="0" y1="80" x2="860" y2="80" class="scanline"/>
    <line x1="0" y1="100" x2="860" y2="100" class="scanline"/>
    <line x1="0" y1="120" x2="860" y2="120" class="scanline"/>
    <line x1="0" y1="140" x2="860" y2="140" class="scanline"/>
    <line x1="0" y1="160" x2="860" y2="160" class="scanline"/>
    <line x1="0" y1="180" x2="860" y2="180" class="scanline"/>
  </g>

  <!-- Border -->
  <rect
    x="4"
    y="4"
    width="852"
    height="192"
    class="border"
    rx="6"
  />

  <!-- Corner accents -->
  <g class="corner">
    <rect x="4" y="4" width="14" height="3"/>
    <rect x="4" y="4" width="3" height="14"/>

    <rect x="842" y="4" width="14" height="3"/>
    <rect x="853" y="4" width="3" height="14"/>

    <rect x="4" y="193" width="14" height="3"/>
    <rect x="4" y="183" width="3" height="14"/>

    <rect x="842" y="193" width="14" height="3"/>
    <rect x="853" y="183" width="3" height="14"/>
  </g>

  <!-- Ambient particles -->
  <circle
    cx="42"
    cy="52"
    r="1.5"
    fill="#00ff9d"
    class="p1"
  />

  <circle
    cx="68"
    cy="168"
    r="1"
    fill="#00ff9d"
    class="p2"
  />

  <circle
    cx="28"
    cy="128"
    r="2"
    fill="#00ff9d"
    class="p3"
  />

  <circle
    cx="824"
    cy="52"
    r="1.5"
    fill="#00ff9d"
    class="p4"
  />

  <circle
    cx="836"
    cy="150"
    r="1"
    fill="#00ff9d"
    class="p5"
  />

  <!-- Right-side animated terminal -->
  <g transform="translate(735 43)">

    <rect
      x="0"
      y="0"
      width="94"
      height="108"
      rx="7"
      fill="#0d1117"
      stroke="#00ff9d"
      stroke-width="1.5"
      opacity=".9"
    />

    <!-- Terminal lights -->
    <circle
      cx="12"
      cy="12"
      r="2"
      fill="#00ff9d"
      class="pulse"
    />

    <circle
      cx="20"
      cy="12"
      r="2"
      fill="#00ff9d"
      class="pulse"
    />

    <circle
      cx="28"
      cy="12"
      r="2"
      fill="#00ff9d"
      class="pulse"
    />

    <!-- Code symbol -->
    <path
      d="M18 38 L29 47 L18 56"
      fill="none"
      stroke="#00ff9d"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Animated code lines -->
    <line
      x1="37"
      y1="56"
      x2="65"
      y2="56"
      stroke="#00ff9d"
      stroke-width="2"
      stroke-linecap="round"
      class="codeflow"
    />

    <line
      x1="37"
      y1="66"
      x2="77"
      y2="66"
      stroke="#00ff9d"
      stroke-width="1.5"
      opacity=".45"
      class="codeflow"
    />

    <line
      x1="18"
      y1="82"
      x2="54"
      y2="82"
      stroke="#00ff9d"
      stroke-width="1.5"
      opacity=".3"
    />

    <line
      x1="18"
      y1="90"
      x2="69"
      y2="90"
      stroke="#00ff9d"
      stroke-width="1.5"
      opacity=".22"
    />

    <circle
      cx="77"
      cy="90"
      r="3"
      fill="#00ff9d"
      opacity=".55"
      class="pulse"
    />

  </g>

  <!-- Main title -->
  <text
    x="36"
    y="87"
    class="title title-anim"
    filter="url(#glow1)"
  >
    Shahriar Zabid
  </text>

  <!-- Blinking cursor -->
  <rect
    x="405"
    y="60"
    width="3"
    height="32"
    class="cursor"
  />

  <!-- Subtitle -->
  <text
    x="38"
    y="116"
    class="subtitle sub-anim"
  >
    software engineer · web developer · IT enthusiast
  </text>

  <!-- Coding tag -->
  <g class="tag1-anim">

    <rect
      x="37"
      y="131"
      width="104"
      height="22"
      rx="4"
      fill="#00ff9d"
      opacity=".1"
      stroke="#00ff9d"
      stroke-width=".8"
      stroke-opacity=".5"
    />

    <text
      x="49"
      y="146"
      class="tag-text"
    >
      &lt;/&gt; coding
    </text>

  </g>

  <!-- AI / WEB tag -->
  <g class="tag2-anim">

    <rect
      x="149"
      y="131"
      width="84"
      height="22"
      rx="4"
      fill="#00ff9d"
      opacity=".1"
      stroke="#00ff9d"
      stroke-width=".8"
      stroke-opacity=".5"
    />

    <text
      x="161"
      y="146"
      class="tag-text"
    >
      AI / WEB
    </text>

  </g>

  <!-- Problem solving tag -->
  <g class="tag3-anim">

    <!-- FIXED: wider box -->
    <rect
      x="241"
      y="131"
      width="150"
      height="22"
      rx="4"
      fill="#00ff9d"
      opacity=".05"
      stroke="#00ff9d"
      stroke-width=".8"
      stroke-opacity=".25"
    />

    <text
      x="252"
      y="146"
      class="tag-text"
      opacity=".6"
    >
      problem solving
    </text>

  </g>

  <!-- Status -->
  <text
    x="38"
    y="178"
    class="status-text"
  >
    [ STATUS: building. learning. shipping. ]
  </text>

</svg>
